<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aemond AO3 Skin</title>
  <meta name="description" content="A dark Aemond-inspired skin for Archive of Our Own.">
  <style>
    :root {
      color-scheme: dark;
      --ink: #ffeccf;
      --muted: #c8cacb;
      --panel: #1b1b1b;
      --line: #c8cacb;
      --accent: #344b7b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #010101;
      color: var(--ink);
      font: 18px/1.6 Georgia, serif;
    }

    main {
      width: min(100% - 2rem, 52rem);
      margin: 0 auto;
      padding: 4rem 0;
    }

    header {
      border-bottom: 5px solid var(--line);
      padding: 2rem clamp(1.25rem, 5vw, 4rem);
      background: linear-gradient(135deg, #312e2e, #010101 70%);
    }

    h1, h2 { margin: 0; font-weight: normal; }
    h1 { font-size: clamp(2.5rem, 8vw, 5rem); line-height: 1; }
    h2 { margin-bottom: .75rem; color: var(--muted); }

    section {
      margin-top: 2rem;
      padding: 1.5rem;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    a { color: var(--ink); }
    .button {
      display: inline-block;
      margin-top: .75rem;
      padding: .6rem 1rem;
      border: 2px outset #000;
      background: linear-gradient(#344b7b, #8ca4b4);
      color: var(--ink);
      text-decoration: none;
      font-weight: bold;
    }

    code {
      color: var(--muted);
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <header>
    <h1>Aemond</h1>
  </header>
  <main>
    <section>
      <h2>AO3 site skin</h2>
      <p>A dark, candlelit-inspired skin for Archive of Our Own.</p>
      <a class="button" href="./Skin%20code">View skin code</a>
    </section>
    <section>
      <h2>Install</h2>
      <p>Copy the contents of <code>Skin code</code> into a new AO3 Site Skin, then save and apply it.</p>
    </section>
  </main>
</body>
</html>
